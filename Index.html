<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shariq Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0b;
      color: white;
      min-height: 100vh;
      text-align: center;
    }

    header {
      padding: 35px 20px;
      background: linear-gradient(135deg, #151515, #000);
    }

    h1 {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aaa;
      font-size: 18px;
    }

    .gallery {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      padding: 35px 20px;
    }

    .card {
      width: 280px;
      background: #161616;
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    .card img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      border-radius: 12px;
    }

    .card p {
      padding: 15px 5px 8px;
      font-size: 17px;
    }

    .about {
      max-width: 700px;
      margin: 20px auto 50px;
      padding: 30px 20px;
    }

    .about h2 {
      font-size: 28px;
      margin-bottom: 12px;
    }

    .about p {
      color: #bbb;
      line-height: 1.7;
    }

    footer {
      padding: 20px;
      background: #111;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>Shariq</h1>
    <p class="subtitle">Welcome to my website</p>
  </header>

  <section class="gallery">

    <div class="card">
      <img src="photo1.jpg" alt="Shariq Photo 1">
      <p>Shariq</p>
    </div>

    <div class="card">
      <img src="photo2.jpg" alt="Shariq Photo 2">
      <p>Shariq</p>
    </div>

    <div class="card">
      <img src="photo3.jpg" alt="Shariq Photo 3">
      <p>Shariq</p>
    </div>

  </section>

  <section class="about">
    <h2>About Shariq</h2>
    <p>
      Welcome to Shariq's personal website.
      This website is made with HTML and CSS.
    </p>
  </section>

  <footer>
    © 2026 Shariq Website
  </footer>

</body>
</html>
